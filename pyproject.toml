[project]
name = "conways-game-of-life"
version = "2.0.0"
description = "Conway's Game of Life: GPU field (32 cells per texel) and unbounded HashLife mode"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Willi Müller" }]
requires-python = ">=3.10"
dependencies = ["numpy>=2", "pyglet>=2.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
